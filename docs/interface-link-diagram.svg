  <text x="1235" y="368" class="group-title">Nhóm màn hình công khai</text>
  <rect x="1090" y="390" width="175" height="62" class="box public"/>
  <text x="1177.5" y="414" class="label">BXH công khai</text>
  <text x="1177.5" y="436" class="route">/public/standings</text>

  <rect x="1300" y="390" width="175" height="62" class="box public"/>
  <text x="1387.5" y="414" class="label">Lịch công khai</text>
  <text x="1387.5" y="436" class="route">/public/schedule</text>

  <rect x="1510" y="390" width="175" height="62" class="box public"/>
  <text x="1597.5" y="414" class="label">Kết quả công khai</text>
  <text x="1597.5" y="436" class="route">/public/results</text>

  <path d="M950 303 V340 H1177.5 V390" class="edge"/>
  <path d="M950 303 V340 H1387.5 V390" class="edge"/>
  <path d="M950 303 V340 H1597.5 V390" class="edge"/>
  <path d="M950 303 C850 340 700 330 630 303" class="soft"/>

  <!-- Dashboard -->
  <rect x="835" y="545" width="230" height="76" class="box main"/>
  <text x="950" y="575" class="label">Dashboard / Trang chủ</text>
  <text x="950" y="600" class="route">/</text>

  <path d="M525 303 C620 425 745 505 835 583" class="edge"/>
  <path d="M892.5 452 C900 485 920 515 950 545" class="edge"/>

