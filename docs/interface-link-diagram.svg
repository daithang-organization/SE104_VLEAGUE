<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1280" viewBox="0 0 1900 1280">
  <defs>
    <pattern id="smallGrid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M 14 0 L 0 0 0 14" fill="none" stroke="#eef2f7" stroke-width="1"/>
    </pattern>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <rect width="70" height="70" fill="url(#smallGrid)"/>
      <path d="M 70 0 L 0 0 0 70" fill="none" stroke="#d8dee9" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111827"/>
    </marker>
    <style>
      .page-title { font: 700 30px "Times New Roman", serif; fill: #111827; }
      .subtitle { font: 16px Arial, sans-serif; fill: #374151; }
      .group-title { font: 700 18px Arial, sans-serif; fill: #111827; }
      .box { fill: #ffffff; stroke: #111827; stroke-width: 2; rx: 0; }
      .main { fill: #f8fafc; stroke-width: 2.4; }
      .public { fill: #ecfeff; }
      .auth { fill: #fff7ed; }
      .admin { fill: #f5f3ff; }
      .detail { fill: #f0fdf4; }
      .account { fill: #eff6ff; }
      .fallback { fill: #fff1f2; }
      .label { font: 700 16px Arial, sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .route { font: 12px Arial, sans-serif; fill: #4b5563; text-anchor: middle; }
      .hint { font: 12px Arial, sans-serif; fill: #6b7280; text-anchor: middle; }
      .edge { fill: none; stroke: #111827; stroke-width: 2; marker-end: url(#arrow); }
      .bus { fill: none; stroke: #111827; stroke-width: 2; }
      .soft { fill: none; stroke: #4b5563; stroke-width: 1.7; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .group { fill: rgba(255,255,255,.55); stroke: #94a3b8; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="1900" height="1280" fill="url(#grid)"/>

  <text x="950" y="42" class="page-title" text-anchor="middle">Sơ đồ liên kết các màn hình - VLeague</text>
  <text x="950" y="70" class="subtitle" text-anchor="middle">Ký hiệu theo tài liệu thiết kế giao diện: khung là màn hình, mũi tên là hướng chuyển điều khiển</text>

  <!-- Entry level -->
  <rect x="835" y="105" width="230" height="70" class="box main"/>
  <text x="950" y="132" class="label">Màn hình khởi đầu</text>
  <text x="950" y="156" class="route">Người dùng truy cập</text>

  <rect x="420" y="235" width="210" height="68" class="box auth"/>
  <text x="525" y="261" class="label">Đăng nhập</text>
  <text x="525" y="284" class="route">/login</text>

  <rect x="835" y="235" width="230" height="68" class="box public"/>
  <text x="950" y="261" class="label">Trang công khai</text>
  <text x="950" y="284" class="route">PublicLayout</text>

  <rect x="1270" y="235" width="210" height="68" class="box fallback"/>
  <text x="1375" y="261" class="label">Không tìm thấy</text>
  <text x="1375" y="284" class="route">404 / *</text>

  <path d="M950 175 V205 H525 V235" class="edge"/>
  <path d="M950 175 V235" class="edge"/>
  <path d="M950 175 V205 H1375 V235" class="edge"/>

  <!-- Auth screens -->
  <text x="295" y="368" class="group-title">Nhóm xác thực</text>
  <rect x="75" y="390" width="155" height="62" class="box auth"/>
  <text x="152.5" y="414" class="label">Đăng ký</text>
  <text x="152.5" y="436" class="route">/register</text>

  <rect x="260" y="390" width="155" height="62" class="box auth"/>
  <text x="337.5" y="414" class="label">Xác thực email</text>
  <text x="337.5" y="436" class="route">/verify-email</text>

  <rect x="445" y="390" width="155" height="62" class="box auth"/>
  <text x="522.5" y="414" class="label">Quên mật khẩu</text>
  <text x="522.5" y="436" class="route">/forgot-password</text>

  <rect x="630" y="390" width="155" height="62" class="box auth"/>
  <text x="707.5" y="414" class="label">Đặt lại MK</text>
  <text x="707.5" y="436" class="route">/reset-password</text>

  <rect x="815" y="390" width="155" height="62" class="box auth"/>
  <text x="892.5" y="414" class="label">OAuth</text>
  <text x="892.5" y="436" class="route">/auth/oauth-callback</text>

  <path d="M525 303 V340 H152.5 V390" class="edge"/>
  <path d="M525 303 V340 H337.5 V390" class="edge"/>
  <path d="M525 303 V340 H522.5 V390" class="edge"/>
  <path d="M522.5 452 V480 H707.5 V452" class="edge"/>
  <path d="M525 303 V340 H892.5 V390" class="edge"/>

