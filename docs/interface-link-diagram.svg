  <text x="1220" y="772" class="route">/standings</text>

  <rect x="1325" y="725" width="150" height="64" class="box main"/>
  <text x="1400" y="749" class="label">Đối đầu</text>
  <text x="1400" y="772" class="route">/head-to-head</text>

  <rect x="1505" y="725" width="150" height="64" class="box main"/>
  <text x="1580" y="749" class="label">Báo cáo</text>
  <text x="1580" y="772" class="route">/reports</text>

  <rect x="1685" y="725" width="150" height="64" class="box admin"/>
  <text x="1760" y="749" class="label">Người dùng</text>
  <text x="1760" y="772" class="route">/users</text>

  <rect x="65" y="865" width="150" height="64" class="box admin"/>
  <text x="140" y="889" class="label">Quy định</text>
  <text x="140" y="912" class="route">/regulations</text>

  <path d="M140 675 V725" class="edge"/>
  <path d="M320 675 V725" class="edge"/>
  <path d="M500 675 V725" class="edge"/>
  <path d="M680 675 V725" class="edge"/>
  <path d="M860 675 V725" class="edge"/>
  <path d="M1040 675 V725" class="edge"/>
  <path d="M1220 675 V725" class="edge"/>
  <path d="M1400 675 V725" class="edge"/>
  <path d="M1580 675 V725" class="edge"/>
  <path d="M1760 675 V725" class="edge"/>
  <path d="M140 789 V865" class="edge"/>

  <!-- Detail screens -->
  <text x="690" y="1012" class="group-title" text-anchor="middle">Các màn hình chi tiết</text>

  <rect x="245" y="1045" width="150" height="64" class="box detail"/>
  <text x="320" y="1069" class="label">Chi tiết đội</text>
  <text x="320" y="1092" class="route">/teams/:id</text>

  <rect x="425" y="1045" width="150" height="64" class="box detail"/>
  <text x="500" y="1069" class="label">Chi tiết sân</text>
  <text x="500" y="1092" class="route">/stadiums/:id</text>

  <rect x="605" y="1045" width="150" height="64" class="box detail"/>
  <text x="680" y="1069" class="label">Chi tiết cầu thủ</text>
  <text x="680" y="1092" class="route">/players/:id</text>

  <rect x="965" y="1045" width="150" height="64" class="box detail"/>
  <text x="1040" y="1069" class="label">Chi tiết trận</text>
  <text x="1040" y="1092" class="route">/matches/:id</text>

  <path d="M320 789 V1045" class="edge"/>
  <path d="M500 789 V1045" class="edge"/>
  <path d="M680 789 V1045" class="edge"/>
  <path d="M1040 789 V1045" class="edge"/>
  <path d="M395 1077 H605" class="soft"/>
  <path d="M575 1077 C710 1135 875 1135 965 1077" class="soft"/>
  <path d="M755 1077 H965" class="soft"/>

  <!-- Business flow -->
  <text x="1160" y="870" class="group-title" text-anchor="middle">Luồng nghiệp vụ nổi bật</text>
  <path d="M140 789 C260 835 610 840 860 789" class="soft"/>
  <path d="M860 789 H965" class="soft"/>
  <path d="M1040 789 C1085 835 1145 835 1220 789" class="soft"/>
  <path d="M1040 789 C1190 875 1430 875 1580 789" class="soft"/>
