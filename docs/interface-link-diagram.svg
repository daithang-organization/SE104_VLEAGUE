  <path d="M835 583 H650" class="edge"/>
  <path d="M1065 583 H1250" class="edge"/>
  <path d="M1065 583 H1455" class="edge"/>

  <!-- Main menu bus -->
  <text x="950" y="698" class="group-title" text-anchor="middle">Menu chức năng sau đăng nhập</text>
  <path d="M950 621 V675" class="bus"/>
  <path d="M140 675 H1760" class="bus"/>

  <!-- Row 1 functions -->
  <rect x="65" y="725" width="150" height="64" class="box admin"/>
  <text x="140" y="749" class="label">Mùa giải</text>
  <text x="140" y="772" class="route">/seasons</text>

  <rect x="245" y="725" width="150" height="64" class="box main"/>
