  <rect x="1465" y="1045" width="150" height="64" class="box account"/>
  <text x="1540" y="1069" class="label">Hồ sơ</text>
  <text x="1540" y="1092" class="route">/profile</text>

  <rect x="1285" y="1160" width="150" height="64" class="box account"/>
  <text x="1360" y="1184" class="label">Đổi mật khẩu</text>
  <text x="1360" y="1207" class="route">/change-password</text>

  <rect x="1645" y="1160" width="150" height="64" class="box account"/>
