  <text x="1720" y="1207" class="route">/sessions</text>

  <path d="M1540 613 V1045" class="edge"/>
  <path d="M1540 1109 L1360 1160" class="edge"/>
  <path d="M1540 1109 L1720 1160" class="edge"/>

  <!-- Search and notification shortcuts kept near the bottom as notes -->
  <path d="M565 613 C535 760 510 915 320 1045" class="soft"/>
  <path d="M565 613 C640 790 710 900 680 1045" class="soft"/>
  <path d="M565 613 C750 780 940 900 1040 1045" class="soft"/>
  <path d="M565 613 C810 735 1120 860 500 1045" class="soft"/>
  <path d="M1335 613 C1275 770 1130 900 1040 1045" class="soft"/>

  <!-- Legend -->
  <rect x="70" y="1185" width="900" height="54" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="92" y="1207" class="subtitle">Ghi chú: đường liền là chuyển màn hình trực tiếp; đường đứt là liên kết chéo, tìm kiếm, thông báo hoặc phụ thuộc nghiệp vụ.</text>
  <text x="92" y="1230" class="subtitle">Các màn hình tô tím là chức năng ADMIN; xanh lá là màn hình chi tiết; xanh dương là màn hình tài khoản.</text>
</svg>
