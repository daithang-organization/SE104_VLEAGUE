name: PR Auto Label

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # ========================================
      # Label based on PR title (Conventional Commits)
      # ========================================
      - name: Label based on PR title
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title || "";
            const typeLabels = {
              feat: "type:feature",
              fix: "type:bugfix",
              chore: "type:chore",
              docs: "type:docs",
              ci: "type:ci",
              refactor: "type:refactor",
              test: "type:test",
              perf: "type:performance",
              style: "type:style",
              revert: "type:revert"
            };

            // Match conventional commits with optional scope: feat(api): message
            const match = title.match(/^(feat|fix|chore|docs|ci|refactor|test|perf|style|revert)(\(.+\))?!?:\s+/);
            if (!match) {
              console.log("PR title does not match conventional commits format");
              return;
            }

            const type = match[1];
            const label = typeLabels[type];

            if (label) {
              console.log(`Adding label: ${label}`);
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [label]
              });
            }

            // Check for breaking change indicator
            if (title.includes("!:")) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ["breaking-change"]
              });
            }

      # ========================================
      # Label based on changed files
      # ========================================
      - name: Label based on changed files
        uses: actions/github-script@v9
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const labels = new Set();

            for (const file of files) {
              const path = file.filename;

              // Area labels
              if (path.startsWith("apps/api/")) labels.add("area:api");
              if (path.startsWith("apps/web/")) labels.add("area:web");
              if (path.startsWith("infra/")) labels.add("area:infra");
              if (path.startsWith("docs/") || path.endsWith(".md")) labels.add("area:docs");
              if (path.startsWith(".github/")) labels.add("area:ci");
              if (path.includes("prisma")) labels.add("area:database");

              // Special file labels
              if (path.includes("package.json") || path.includes("pnpm-lock")) labels.add("dependencies");
              if (path.includes("test") || path.includes("spec")) labels.add("has-tests");
            }

            if (labels.size > 0) {
              console.log(`Adding labels: ${[...labels].join(", ")}`);
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [...labels]
              });
            }

      # ========================================
      # Label based on PR size
      # ========================================
      - name: Label based on PR size
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const totalChanges = additions + deletions;

            // Remove existing size labels first
            const sizeLabels = ["size:XS", "size:S", "size:M", "size:L", "size:XL"];
            const { data: existingLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            for (const label of existingLabels) {
              if (sizeLabels.includes(label.name)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label.name
                }).catch(() => {}); // Ignore if already removed
              }
            }

            // Determine size label
            let sizeLabel;
            if (totalChanges < 10) {
              sizeLabel = "size:XS";
            } else if (totalChanges < 50) {
              sizeLabel = "size:S";
            } else if (totalChanges < 200) {
              sizeLabel = "size:M";
            } else if (totalChanges < 500) {
              sizeLabel = "size:L";
            } else {
              sizeLabel = "size:XL";
            }

            console.log(`PR has ${totalChanges} changes, adding label: ${sizeLabel}`);
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [sizeLabel]
            });
