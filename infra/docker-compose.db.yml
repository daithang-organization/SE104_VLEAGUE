services:
  db:
    image: postgres:16
    container_name: vleague-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vleague
    ports:
      - "5432:5432"
    volumes:
      - vleague_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vleague"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vleague_db_data:
